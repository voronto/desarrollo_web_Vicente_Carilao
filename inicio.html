    <script>
        const botonInformar = document.querySelectorAll('.botones')[3];
        botonInformar.addEventListener('click', (evento) => {
            evento.preventDefault(); 
            if (sessionStorage.getItem("usuarioRegistrado") === "true") {
                window.location.href = "avistamientos/nuevoAvistamientos.html";
            } else {
            alert("Por favor, completa el registro voluntario primero.");
            window.location.href = "registro/registro.html";
            }
        });
