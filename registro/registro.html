<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="registro.css" />
    <title>Inicio de sesion</title>
</head>
<body>
    <div class="forma">
        <h1>Aves de Chile</h1>
        <h2>Registro</h2>
        <form class="datos">
            <div id="nombrePersona" class="inputDatos">
                <label for="nombre">Nombre:</label>
                <input id="nombre" type="text" required>
            </div>
            <div id="regionPersona" class="inputDatos">
                <label for="region">Region:</label>
                <select id="region" required>
                    <option value="">Selecciona tu región</option>
                    <option value="arica-parinacota">Arica y Parinacota</option>
                    <option value="tarapaca">Tarapacá</option>
                    <option value="antofagasta">Antofagasta</option>
                    <option value="atacama">Atacama</option>
                    <option value="coquimbo">Coquimbo</option>
                    <option value="valparaiso">Valparaíso</option>
                    <option value="metropolitana">Región Metropolitana</option>
                    <option value="ohiggins">O'Higgins</option>
                    <option value="maule">Maule</option>
                    <option value="nuble">Ñuble</option>
                    <option value="biobio">Biobío</option>
                    <option value="araucania">Araucanía</option>
                    <option value="los-rios">Los Ríos</option>
                    <option value="los-lagos">Los Lagos</option>
                    <option value="aysen">Aysén</option>
                    <option value="magallanes">Magallanes y de la Antártica Chilena</option>
                </select>
            </div>
            <div id="comunaPersona" class="inputDatos">
                <label for="comuna">Comuna:</label>
                <select id="comuna" required>
                    <option value="">Selecciona tu comuna </option>
                </select>
            </div>
            <div id="direccionPersona" class="inputDatos">
                <label for="direccion">Direcicon:</label>
                <input id="direccion" type="text" required>
            </div>
            <div id="emailPersona" class="inputDatos">
                <label for="email">Email</label>
                <input id="email" type="email" required>
            </div>
            <div id="contraseñaPersona" class="inputDatos">
                <label for="contraseña">Contraseña</label>
                <input id="contraseña" type="password" required>
            </div>
            <div class="botones">
                <button type="button" id="envio">
                    Registrarse
                </button>
            </div>
        </form>
        <div id="exitoContainer"></div>
    </div>
<script src="registro.js"></script>    
</body>
</html>
