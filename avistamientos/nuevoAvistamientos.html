<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="nuevoAvistamiento.css" />
    <title>avistamientos</title>
</head>
<body>
    <div class="forma">
        <h1> Aves de Chile</h1>
        <h2> Registrar avistamiento</h2>
        <form class="datos">
            <div class="inputDatos">
                <label for="tipoAve">Tipo de ave:</label>
                <select id="tipoAve" required>
                    <option value="">Selecciona un tipo</option>
                    <option value="rapaz">Ave Rapaz</option>
                    <option value="acuatica">Ave Acuática o Marina</option>
                    <option value="playera">Ave Playera o Vadeadora</option>
                    <option value="paseriforme">Pájaros pequeños (Paseriformes)</option>
                    <option value="picaflor">Picaflor</option>
                    <option value="terrestre">Ave Terrestre</option>
                    <option value="trepadora">Ave Trepadora</option>
                </select>
            </div>
            <div class="inputDatos">
                <label for="nombre">Nombre:</label>
                <input id="nombre" type="text" required>
            </div>
            <div class="inputDatos">
                <label for="lugarAvistamiento">Lugar de avistamiento:</label>
                <input id="lugarAvistamiento" type="text" required>
            </div>
            <div class="inputDatos>">
                <label for="fechaAvistamiento">Fecha de avistamiento:</label>
                <input id="fechaAvistamiento" type="date" required>
            </div>
            <div class="inputDatos">
                <label for="horaAvistamiento">Hora del avistamiento:</label>
                <input type="time" id="horaAvistamiento" required>
            </div>
            <div class="inputDatos">
                <label for="pruebaAvistamiento">Adjunta una foto o vídeo del avistamiento:</label>
                <input type="file" id="pruebaAvistamiento" accept="image/*, video/*" required>
            </div>
            <div class="botones">
                <button type="button" id="envio">
                    Enviar
                </button>
                <a class="volver" href="../inicio.html">Volever al inicio</a>
            </div>

        </form>
    </div>
<script src="nuevoAvistamientos.js"></script> 
</body>
</html>
