<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="avistamientos.css" />
    <title>Listado de avistamientos</title>
</head>
<body>
    <div class="contenedor-tabla">
        <h1>Aves de Chile</h1>
        <h2>Listado de Avistamientos</h2>
        <div class="controles">
            <div class="inputDatos">
                <label for="filtroTipo">Filtrar por tipo de ave:</label>
                <select id="filtroTipo">
                    <option value="todos">Todos</option>
                    <option value="rapaz">Ave Rapaz</option>
                    <option value="acuatica">Ave Acuática</option>
                    <option value="playera">Vadeadora</option>
                    <option value="paseriforme">Paseriformes</option>
                    <option value="picaflor">Picaflor</option>
                    <option value="terrestre">Ave Terrestre</option>
                    <option value="piciformes">piciformes</option>
                </select>
            </div>
            <div class="inputDatos">
                <label for="ordenarPor">Ordenar por:</label>
                <select id="ordenarPor">
                    <option value="fechaDesc">Fecha (Más reciente)</option>
                    <option value="fechaAsc">Fecha (Más antigua)</option>
                    <option value="lugarAsc">Lugar (A-Z)</option>
                    <option value="lugarDesc">Lugar (Z-A)</option>
                </select>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Lugar</th>
                    <th>Fecha y Hora</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">            
            </tbody>
        </table>

        <nav class="paginacion" aria-label="Navegación de páginas">
        </nav>

    </div>

<script src="avistamientos.js"></script>
</body>
</html>
