<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estadisticas.css" />
    <title>Estadísticas de Avistamientos</title>
</head>
<body>
    <div class="contenedor-dashboard">
        <h1>Aves de Chile</h1>
        <h2>Panel de Estadísticas</h2>

        <div class="dashboard-grid">
            <div class="tarjeta-metrica">
                <h3>Total de Avistamientos</h3>
                <p id="totalAvistamientos" class="numero-grande">0</p>
            </div>

            <div class="tarjeta-metrica">
                <h3>Distribución por Tipo</h3>
                <div id="resultadoTipos">
                    <!-- El JS inyectará los datos aquí -->
                </div>
            </div>

            <!-- Tarjeta 3: Último registro -->
            <div class="tarjeta-metrica">
                <h3>Último Avistamiento</h3>
                <div id="ultimoAvistamiento" class="texto-normal">
                    <!-- El JS inyectará los datos aquí -->
                </div>
            </div>
        </div>

        <div class="botones-container">
            <a href="../inicio.html" class="btn-volver">Volver al Inicio</a>
        </div>
    </div>

    <script src="estadisticas.js"></script>
</body>
</html>
